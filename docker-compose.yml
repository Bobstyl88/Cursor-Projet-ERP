version: '3.9'

services:
  # ─────────────────────────────────────────
  # Backend API (NestJS)
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: erp_backend
    restart: unless-stopped
    env_file: .env
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    depends_on:
      - mongo
      - redis
    networks:
      - erp_net
    volumes:
      - ./apps/backend:/app
      - /app/node_modules

  # ─────────────────────────────────────────
  # Frontend (Next.js)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: erp_frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - '${FRONTEND_PORT:-3001}:3001'
    depends_on:
      - backend
    networks:
      - erp_net
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next

  # ─────────────────────────────────────────
  # MongoDB
  # ─────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: erp_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-erp}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-erp_secret}
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
      - ./infra/docker/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - erp_net

  # ─────────────────────────────────────────
  # Redis (cache + job queues)
  # ─────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: erp_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - erp_net

  # ─────────────────────────────────────────
  # Nginx reverse proxy
  # ─────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: erp_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - erp_net

volumes:
  mongo_data:
  redis_data:

networks:
  erp_net:
    driver: bridge
